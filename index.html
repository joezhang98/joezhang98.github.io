<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Joe Zhang</title>
<!-- <link href="assets/css/style.css" rel="stylesheet"/> -->
<!-- Font Awesome Kit -->
<script src="https://kit.fontawesome.com/c9e58096f2.js" crossorigin="anonymous"></script>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    color: #222222;
}
.grid-container {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 2rem;
    max-width: 1000px;
    margin: 4rem auto 2rem auto;
    padding: 0 2rem;
}

.left-column {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.left-column .author-profile {
    text-align: left;
}
.left-column img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
}
.left-column .name {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 1rem;
}
.left-column .contact {
    display: flex;
    align-items: center;
    font-size: 1rem;
    color: #333333;
    margin: 0.25rem 0;
}
.left-column .contact i {
    margin-right: 0.5rem;
    min-width: 1.2rem;
    text-align: left;
}
.left-column .contact a {
    text-decoration: none;
    color: #333333;
}
.left-column .contact a:hover {
    text-decoration: underline;
}
.right-column h1 {
    margin-top: 0;
}
@media (max-width: 768px) {
    .grid-container {
    grid-template-columns: 1fr;
    margin-top: 2rem;
    }
    .left-column {
    margin-bottom: 2rem;
    }
}
</style>
</head>

<body>
    <div class="grid-container">
        <div class="left-column">
            <img src="assets/images/headshot.jpg" alt="Joe Zhang">
            <div class="author-profile">
                <div class="name">Joe Zhang</div>
                <div class="contact">
                    <i class="fas fa-envelope"></i> 
                    <a href="mailto:joe.z.zhang@stanford.edu"> Email</a>
                </div>
                <div class="contact">
                    <i class="fa-brands fa-google-scholar"></i> 
                    <a href="https://scholar.google.com/citations?user=PcCdicMAAAAJ&hl"> Google Scholar</a>
                </div>
            </div>
        </div>
        <div class="right-column">
            <h1>About Me</h1>
            <p>Hi!</p>
        </div>
    </div>
</body>
</html>
