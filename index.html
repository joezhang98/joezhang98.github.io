<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Me</title>
  <script src="https://kit.fontawesome.com/c9e58096f2.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
    }

    .custom-grid-container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 2rem;
      padding: 4rem 2rem 2rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .author-column {
      text-align: center;
    }

    .author-name {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .author-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    .author-links {
      margin-top: 1rem;
    }

    .author-links a {
      display: flex;
      align-items: center;
      justify-content: start;
      gap: 0.5rem;
      color: #333;
      text-decoration: none;
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }

    .author-links a:hover {
      color: #007acc;
    }

    .content-column h1 {
      font-size: 2rem;
      margin-top: 0;
    }

    .content-column p {
      font-size: 1rem;
      line-height: 1.6;
      max-width: 700px;
    }
  </style>
</head>

<body>
  <div class="custom-grid-container">
    <div class="author-column">
      <img src="assets/images/headshot.jpg" alt="Author photo" class="author-photo" />
      <div class="author-name">Joe Zhang</div>

      <div class="author-links">
        <a href="mailto:joe.z.zhang@stanford.edu">
          <i class="fas fa-envelope"></i> Email
        </a>
      </div>
    </div>

    <div class="content-column">
      <h1>About Me</h1>
      <p>
        Hi!
      </p>
    </div>
  </div>
</body>
</html>
